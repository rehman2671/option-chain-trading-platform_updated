name: Paper staging RC1 integration smoke (NO live broker)

on:
  push:
    branches:
      - main
      - release/paper-staging-rc1-integration
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-staging-rc1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paper-staging-rc1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      PAPER_STAGING_MODE: '1'
      DATA_PROVIDER: practice
      UPSTOX_ACCESS_TOKEN: ''
      UPSTOX_TOKEN: ''
      UPSTOX_API_KEY: ''
      UPSTOX_API_SECRET: ''
      UPSTOX_PIN: ''
      UPSTOX_TOTP_SECRET: ''
      UPSTOX_TOTP_KEY: ''
      UPSTOX_MOBILE_NO: ''
      UPSTOX_CLIENT_ID: ''
      UPSTOX_USER_ID: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify NO runtime account DB/WAL tracked in RC source
        shell: bash
        run: |
          if [ -n "$(git ls-files '*.sqlite' '*.sqlite-wal' '*.sqlite-shm' '*.db' '*.db-wal' '*.db-shm')" ]; then
            echo "::error::Runtime account DB must not be tracked in paper staging"
            exit 1
          fi
      - name: Reproducible package install
        run: npm ci
      - name: TypeScript full typecheck
        run: npm run lint
      - name: Staging startup, token and direct order denial adversarial tests
        run: npx tsx --test --test-concurrency=1 src/quant/tests/ema15m_paper_staging_rc_integration.test.ts
      - name: Production frontend and server bundle
        run: NODE_ENV=production npm run build
      - name: Isolated production-mode HTTP smoke (practice, no credentials or network broker orders)
        run: npm run smoke:paper-staging
      - name: Ordinary Google AI Studio/main startup compatibility (no staging flag, no broker credentials)
        run: npm run smoke:main-compat

  paper-staging-container:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build nonroot paper-only container without account state
        run: docker build --file Dockerfile.paper-staging --tag paper-rc1:ci .
      - name: Boot isolated container, virtual trade, restart on same data volume
        shell: bash
        run: |
          set -euo pipefail
          volume="paper-rc1-data-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          name="paper-rc1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$volume" >/dev/null
          cleanup() {
            docker rm -f "$name" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          jwt="$(openssl rand -hex 48)"
          pass="$(openssl rand -hex 24)"
          export PAPER_RC_ADMIN_EMAIL="paper-rc-docker@example.invalid"
          export PAPER_RC_ADMIN_PASSWORD="$pass"
          export PAPER_RC_RESULT_PATH="$RUNNER_TEMP/paper-rc-container-position-id"
          export PAPER_RC_CONTAINER_URL='http://127.0.0.1:43138'
          run_container() {
            docker run -d --rm --name "$name" \
              --read-only --cap-drop ALL --security-opt no-new-privileges \
              --tmpfs /tmp:rw,nosuid,nodev,size=64m \
              -v "$volume:/data" -p 127.0.0.1:43138:3000 \
              -e NODE_ENV=production -e PAPER_STAGING_MODE=1 \
              -e DATA_PROVIDER=practice -e PAPER_STAGING_DB_DIR=/data \
              -e JWT_SECRET="$jwt" -e ADMIN_EMAIL="$PAPER_RC_ADMIN_EMAIL" \
              -e ADMIN_INITIAL_PASSWORD="$pass" \
              paper-rc1:ci >/dev/null
          }
          wait_ready() {
            for i in $(seq 1 80); do
              if curl --fail --silent --max-time 2 "$PAPER_RC_CONTAINER_URL/api/release/status" >/dev/null; then
                return 0
              fi
              sleep 1
            done
            docker logs "$name" --tail 80 || true
            return 1
          }
          run_container
          wait_ready
          docker exec "$name" node -e "const f=require('fs');const s=f.statSync('/data/option_platform.sqlite');if(!s.isFile())process.exit(1)"
          node scripts/verify_paper_staging_container.mjs
          docker stop "$name" >/dev/null
          run_container
          wait_ready
          node scripts/verify_paper_staging_container.mjs
