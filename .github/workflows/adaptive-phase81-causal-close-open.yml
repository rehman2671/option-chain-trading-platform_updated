name: Adaptive Phase81 causal close-as-of and overnight open census (offline)
on:
  push:
    branches:
      - 'research/adaptive-v2-phase81-causal-close-open-censor'
  pull_request:
    branches:
      - 'research/adaptive-v2-phase80-private-original-l1-intake'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-causal-close-and-gap-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript static gate
        run: npm run lint
      - name: Phase79 + Phase80 + Phase81 offline causal observation and private data tests
        run: |
          npx tsx --test --test-concurrency=1 \
            src/quant/tests/ema15m_adaptive_phase79_original_premium_path_coverage.test.ts \
            src/quant/tests/ema15m_adaptive_phase80_private_l1_intake.test.ts
