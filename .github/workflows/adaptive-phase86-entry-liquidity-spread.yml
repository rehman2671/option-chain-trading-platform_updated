name: Adaptive Phase86 option entry BID liquidity and quote spread census (offline)
on:
  push:
    branches:
      - 'research/adaptive-v2-phase86-entry-bid-spread-risk-census'
  pull_request:
    branches:
      - 'research/adaptive-v2-phase85-indexed-l1-close-coverage'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-option-quoted-entry-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript static gate
        run: npm run lint
      - name: Phase79-86 as-of BID ASK liquidity spread and redacted private original quote tests
        run: |
          npx tsx --test --test-concurrency=1 \
            src/quant/tests/ema15m_adaptive_phase79_original_premium_path_coverage.test.ts \
            src/quant/tests/ema15m_adaptive_phase80_private_l1_intake.test.ts
