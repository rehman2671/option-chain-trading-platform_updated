# Superseded commits must not monopolize runners; PR and push checks
# remain separate and the latest SHA still runs independently.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Separate jobs are essential: the EMA15M focused safety suite alone can
  # take 19+ minutes. Serializing it with bundle compilation AND npm test
  # under one 25 minute timeout used to cancel Phase59-61 full regressions.
  # All three jobs must pass independently before anyone considers merging.
  ema15m-invariant-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Poppler verifier for native unsigned-PDF rejection test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          test -x /usr/bin/pdfsig
          test -x /usr/bin/pdftotext
          test -x /usr/bin/openssl
      - name: Static TypeScript check
        run: npm run lint
      - name: Targeted EMA15M invariant tests
        run: npx tsx --test --test-concurrency=1 src/quant/tests/ema15m_*.test.ts

  production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Production bundle compilation
        run: NODE_ENV=production npm run build

  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Poppler for all PDF evidence regressions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          test -x /usr/bin/pdfsig
          test -x /usr/bin/pdftotext
          test -x /usr/bin/openssl
      - name: Full regression suite (must pass before merge)
        run: npm test
