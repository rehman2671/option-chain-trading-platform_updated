name: EMA15M safety checks
on:
  push:
    branches: [codex]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Static TypeScript check
        run: npm run lint
      - name: Isolated automated tests
        run: npm test
      - name: Production bundle compilation
        run: npm run build
