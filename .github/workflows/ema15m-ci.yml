name: EMA15M safety checks
on:
  push:
    branches: [codex, 'research/adaptive-v2-historical-comparison', 'research/adaptive-v2-evidence-capture', 'research/adaptive-v2-verified-ingestion-walkforward', 'research/adaptive-v2-phase6-integrity-review', 'research/adaptive-v2-phase7-positional-exit-replay', 'research/adaptive-v2-phase8-entry-first-cohort', 'research/adaptive-v2-phase9-positional-paper-reconciliation']
  pull_request:
    branches: [main, codex, 'research/adaptive-v2-historical-comparison', 'research/adaptive-v2-evidence-capture', 'research/adaptive-v2-verified-ingestion-walkforward', 'research/adaptive-v2-phase6-integrity-review', 'research/adaptive-v2-phase7-positional-exit-replay', 'research/adaptive-v2-phase8-entry-first-cohort']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Static TypeScript check
        run: npm run lint
      - name: Targeted EMA15M invariant tests
        run: npx tsx --test --test-concurrency=1 src/quant/tests/ema15m_*.test.ts
      - name: Production bundle compilation
        run: NODE_ENV=production npm run build
      - name: Full regression suite (must pass before merge)
        run: npm test
