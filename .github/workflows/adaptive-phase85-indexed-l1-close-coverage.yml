name: Adaptive Phase85 indexed all-original option L1 closing coverage (offline)
on:
  push:
    branches:
      - 'research/adaptive-v2-phase85-indexed-l1-close-coverage'
  pull_request:
    branches:
      - 'research/adaptive-v2-phase84-native-l1-clock-sequence-integrity'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  indexed-original-option-close-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript static gate
        run: npm run lint
      - name: Phase79-85 indexed closing BID and private original market quote tests
        run: |
          npx tsx --test --test-concurrency=1 \
            src/quant/tests/ema15m_adaptive_phase79_original_premium_path_coverage.test.ts \
            src/quant/tests/ema15m_adaptive_phase80_private_l1_intake.test.ts
