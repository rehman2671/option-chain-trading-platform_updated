name: Adaptive Phase76 offline NRML positional paper risk safeguards
on:
  push:
    branches:
      - 'research/adaptive-v2-phase76-nrml-paper-risk-monitor'
  pull_request:
    branches:
      - 'research/adaptive-v2-phase75-counterfactual-premium-stop-stress'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-paper-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript static gate
        run: npm run lint
      - name: Phase76 deterministic offline paper-only risk regression
        run: npx tsx --test --test-concurrency=1 src/quant/tests/ema15m_adaptive_phase76_nrml_paper_risk_monitor.test.ts
