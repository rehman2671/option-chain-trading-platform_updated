name: Adaptive Phase84 original option L1 strict clock and source sequence (offline)
on:
  push:
    branches:
      - 'research/adaptive-v2-phase84-native-l1-clock-sequence-integrity'
  pull_request:
    branches:
      - 'research/adaptive-v2-phase83-causal-quote-supersession'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-source-clock-and-sequence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript static gate
        run: npm run lint
      - name: Phase79-84 original L1 clock sequence and private intake negative controls
        run: |
          npx tsx --test --test-concurrency=1 \
            src/quant/tests/ema15m_adaptive_phase79_original_premium_path_coverage.test.ts \
            src/quant/tests/ema15m_adaptive_phase80_private_l1_intake.test.ts
