name: Adaptive Phase108 NRML GTT two-pass lifecycle drift (read-only)
on:
  push:
    branches:
      - 'research/adaptive-v2-phase108-gtt-two-pass-drift'
  pull_request:
    branches:
      - 'research/adaptive-v2-phase107-gtt-session-epoch'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gtt-stop-lifecycle-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript static gate
        run: npm run lint
      - name: Phase108 two-pass cancel/replace/partial-fill/GTT drift plus prior safeguards
        run: |
          npx tsx --test --test-concurrency=1 \
            src/quant/tests/ema15m_adaptive_phase108_gtt_two_pass_drift.test.ts \
            src/quant/tests/ema15m_adaptive_phase107_gtt_broker_auth_epoch.test.ts \
            src/quant/tests/ema15m_adaptive_phase94_nrml_competing_orders.test.ts \
            src/quant/tests/ema15m_adaptive_phase93_nrml_stop_fill_position_conservation.test.ts \
            src/quant/tests/ema15m_adaptive_phase92_gtt_child_lineage.test.ts
