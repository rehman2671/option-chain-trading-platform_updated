name: Adaptive Phase121 GTT microsecond expiry and 1-8W horizon audit
on:
  push:
    branches:
      - 'research/adaptive-v2-phase121-gtt-expiry-horizon-quarantine'
  pull_request:
    branches:
      - 'research/adaptive-v2-phase120-legacy-fo-child-trade-identity'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  timestamp-expiry-no-broker-write:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript static gate
        run: npm run lint
      - name: Phase121 microsecond GTT selected horizon and previous NRML safety suites
        run: |
          npx tsx --test --test-concurrency=1 \
            src/quant/tests/ema15m_adaptive_phase121_gtt_expiry_horizon_quarantine.test.ts \
            src/quant/tests/ema15m_adaptive_phase120_legacy_fo_trade_child_linkage.test.ts \
            src/quant/tests/ema15m_adaptive_phase119_native_get_cardinality.test.ts \
            src/quant/tests/ema15m_adaptive_phase118_native_get_session_fence.test.ts \
            src/quant/tests/ema15m_adaptive_phase117_upstox_read_transport_contract.test.ts \
            src/quant/tests/ema15m_adaptive_phase116_portfolio_gtt_stream_offline_replay.test.ts \
            src/quant/tests/ema15m_adaptive_phase115_missing_gtt_historical_sell_join.test.ts \
            src/quant/tests/ema15m_adaptive_phase114_missing_gtt_restart_quarantine.test.ts \
            src/quant/tests/ema15m_adaptive_phase113_single_sell_gtt_child_fills.test.ts \
            src/quant/tests/ema15m_adaptive_phase112_existing_single_sell_gtt.test.ts \
            src/quant/tests/ema15m_adaptive_phase111_multiweek_carry_debit_risk.test.ts \
            src/quant/tests/ema15m_adaptive_phase110_existing_nrml_day_stop.test.ts \
            src/quant/tests/ema15m_adaptive_phase109_gtt_entry_buy_provenance.test.ts \
            src/quant/tests/ema15m_adaptive_phase108_gtt_two_pass_drift.test.ts \
            src/quant/tests/ema15m_adaptive_phase107_gtt_broker_auth_epoch.test.ts \
            src/quant/tests/ema15m_adaptive_phase104_historical_fo_trades.test.ts \
            src/quant/tests/ema15m_adaptive_phase101_original_buy_trade_receipts.test.ts \
            src/quant/tests/ema15m_adaptive_phase90_nrml_live_release_interlock.test.ts
