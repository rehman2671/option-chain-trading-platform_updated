name: Adaptive Phase69 option calendar blind spot and BID gap diagnostics
on:
  push:
    branches:
      - 'research/adaptive-v2-phase69-horizon-calendar-blind-spots'
  pull_request:
    branches:
      - 'research/adaptive-v2-phase68-long-horizon-censoring'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-full-duration-listed-option-source-gaps:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript static gate
        run: npm run lint
      - name: Phase69 all-listed original CE PE calendar weekday gaps and quote depth
        run: |
          npx tsx --test --test-concurrency=1 \
            src/quant/tests/ema15m_adaptive_phase69_calendar_blind_spots.test.ts
