name: Adaptive Phase50-60 focused offline research checks
on:
  push:
    branches:
      - 'research/adaptive-v2-phase52-detached-source-calendar-receipts'
      - 'research/adaptive-v2-phase53-original-document-byte-custody'
      - 'research/adaptive-v2-phase54-two-document-native-cms-join'
      - 'research/adaptive-v2-phase55-two-source-native-revocation-tsa'
      - 'research/adaptive-v2-phase56-two-source-native-crypto-e2e'
      - 'research/adaptive-v2-phase57-regime-horizon-debit-risk'
      - 'research/adaptive-v2-phase58-matched-exit-debit-coverage'
      - 'research/adaptive-v2-phase59-cohort-premium-gap-reconciliation'
      - 'research/adaptive-v2-phase60-horizon-regime-evidence-sufficiency'
  pull_request:
    branches:
      - 'research/adaptive-v2-phase51-declared-session-oos-ledger'
      - 'research/adaptive-v2-phase52-detached-source-calendar-receipts'
      - 'research/adaptive-v2-phase53-original-document-byte-custody'
      - 'research/adaptive-v2-phase54-two-document-native-cms-join'
      - 'research/adaptive-v2-phase55-two-source-native-revocation-tsa'
      - 'research/adaptive-v2-phase56-two-source-native-crypto-e2e'
      - 'research/adaptive-v2-phase57-regime-horizon-debit-risk'
      - 'research/adaptive-v2-phase58-matched-exit-debit-coverage'
      - 'research/adaptive-v2-phase59-cohort-premium-gap-reconciliation'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-research-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript static type gate
        run: npm run lint
      - name: Phase50-60 focused synthetic offline invariants
        run: |
          npx tsx --test --test-concurrency=1 \
            src/quant/tests/ema15m_adaptive_phase50_multifold_l1_asof.test.ts \
            src/quant/tests/ema15m_adaptive_phase51_declared_session_oos_ledger.test.ts \
            src/quant/tests/ema15m_adaptive_phase52_detached_source_receipts.test.ts \
            src/quant/tests/ema15m_adaptive_phase53_original_document_bytes.test.ts \
            src/quant/tests/ema15m_adaptive_phase54_two_original_pdf_native_cms.test.ts \
            src/quant/tests/ema15m_adaptive_phase55_two_source_revocation_tsa.test.ts \
            src/quant/tests/ema15m_adaptive_phase56_native_crl_ocsp_tsa_e2e.test.ts \
            src/quant/tests/ema15m_adaptive_phase57_regime_horizon_debit_risk.test.ts \
            src/quant/tests/ema15m_adaptive_phase58_exit_asof_risk_join.test.ts \
            src/quant/tests/ema15m_adaptive_phase59_original_premium_gap_join.test.ts \
            src/quant/tests/ema15m_adaptive_phase60_horizon_regime_sufficiency.test.ts
