name: Adaptive Phase93 original NRML long minus STOP SELL fills (offline)
on:
  push:
    branches:
      - 'research/adaptive-v2-phase93-nrml-stop-fill-position-conservation'
  pull_request:
    branches:
      - 'research/adaptive-v2-phase92-gtt-child-lineage-readonly'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nrml-stop-fill-position-conservation:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript static gate
        run: npm run lint
      - name: Phase90-93 broker, partial SELL, GTT child and original L1 safety
        run: |
          npx tsx --test --test-concurrency=1 \
            src/quant/tests/ema15m_adaptive_phase90_nrml_live_release_interlock.test.ts \
            src/quant/tests/ema15m_adaptive_phase91_nrml_broker_snapshot_audit.test.ts \
            src/quant/tests/ema15m_adaptive_phase92_gtt_child_lineage.test.ts \
            src/quant/tests/ema15m_adaptive_phase93_nrml_stop_fill_position_conservation.test.ts \
            src/quant/tests/ema15m_adaptive_phase79_original_premium_path_coverage.test.ts \
            src/quant/tests/ema15m_adaptive_phase80_private_l1_intake.test.ts
