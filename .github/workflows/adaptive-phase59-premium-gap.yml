name: Adaptive Phase59 original OOS premium reversal next-open gap
on:
  push:
    branches:
      - 'research/adaptive-v2-phase59-cohort-premium-gap-reconciliation'
  pull_request:
    branches:
      - 'research/adaptive-v2-phase58-matched-exit-debit-coverage'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-cohort-premium-gap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Phase59 TypeScript static gate
        run: npm run lint
      - name: Same OOS source Phase19 premium reversal Phase46 overnight gap
        run: |
          npx tsx --test --test-concurrency=1 \
            src/quant/tests/ema15m_adaptive_phase59_original_premium_gap_join.test.ts
