name: Adaptive Phase60 regime horizon evidence sufficiency
on:
  push:
    branches:
      - 'research/adaptive-v2-phase60-horizon-regime-evidence-sufficiency'
  pull_request:
    branches:
      - 'research/adaptive-v2-phase59-cohort-premium-gap-reconciliation'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-oos-regime-horizon-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Phase60 TypeScript static gate
        run: npm run lint
      - name: Original OOS regime duration coverage and expiry buffer synthetic tests
        run: |
          npx tsx --test --test-concurrency=1 \
            src/quant/tests/ema15m_adaptive_phase60_horizon_regime_sufficiency.test.ts
